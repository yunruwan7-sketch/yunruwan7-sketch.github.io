		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":146227124,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
let reportEngineProgress = function () {};
const engine = new Engine({ ...GODOT_CONFIG, onProgress: (current, total) => reportEngineProgress(current, total) });

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
        console.error(err);
        document.getElementById('status-text').textContent = '';
        setStatusNotice('游戏暂时未能载入，请刷新重试，或使用 Chrome / Edge 浏览器。');
        setStatusMode('notice');
        initializing = false;
    }

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');

        const PACK_CHUNKS = [{"file":"index.pck.db68ad1ec151.part1.bin","offset":0,"bytes":36556781,"sha256":"e4243ee7db74ab69e1fc91fd32e1b67ba1aa0542b2f8e9262ebdc4d35a9f1f41"},{"file":"index.pck.db68ad1ec151.part2.bin","offset":36556781,"bytes":36556781,"sha256":"05005d3135bffbce59a623b469f2eba581ffd917504583e83018ef4f802ff1cc"},{"file":"index.pck.db68ad1ec151.part3.bin","offset":73113562,"bytes":36556781,"sha256":"ad16886c3184fa6d6a615194f1963a9334e85444188384902fe719cfbbcf0478"},{"file":"index.pck.db68ad1ec151.part4.bin","offset":109670343,"bytes":36556781,"sha256":"824fa12b97e5e1b3ea51b737aee2f030f9adc009f2e9a8e2ddac1f6576243f3a"}];
        const PACK_BYTES = 146227124;
        const WASM_BYTES = 39514754;
        let packLoaded = 0;
        let wasmLoaded = 0;
        const loadingText = document.getElementById('status-text');

        function updateProgress() {
            statusProgress.max = PACK_BYTES + WASM_BYTES;
            statusProgress.value = packLoaded + wasmLoaded;
            const percent = Math.min(100, Math.floor(100 * statusProgress.value / statusProgress.max));
            loadingText.textContent = percent === 100 ? '正在启动游戏…' : `正在载入游戏… ${percent}%`;
        }

        async function downloadPack() {
            const pack = new Uint8Array(PACK_BYTES);
            await Promise.all(PACK_CHUNKS.map(async (chunk) => {
                const response = await fetch(chunk.file);
                if (!response.ok) throw new Error('游戏载入失败，请刷新页面重试。');
                let received = 0;
                function append(bytes) {
                    if (received + bytes.byteLength > chunk.bytes) throw new Error('游戏文件不完整，请刷新页面重试。');
                    pack.set(bytes, chunk.offset + received);
                    received += bytes.byteLength;
                    packLoaded += bytes.byteLength;
                    updateProgress();
                }
                if (response.body && response.body.getReader) {
                    const reader = response.body.getReader();
                    for (;;) {
                        const result = await reader.read();
                        if (result.done) break;
                        append(result.value);
                    }
                } else {
                    append(new Uint8Array(await response.arrayBuffer()));
                }
                if (received !== chunk.bytes) throw new Error('游戏文件不完整，请刷新页面重试。');
            }));
            return pack.buffer;
        }

        reportEngineProgress = function (current) {
            wasmLoaded = Math.min(WASM_BYTES, current);
            updateProgress();
        };
        updateProgress();
        Promise.all([
            engine.init(GODOT_CONFIG.executable),
            downloadPack().then((buffer) => engine.preloadFile(buffer, 'index.pck')),
        ]).then(() => engine.start({
            args: ['--main-pack', 'index.pck'].concat(GODOT_CONFIG.args || []),
        })).then(() => {
            setStatusMode('hidden');
        }, displayFailureNotice);

	}
}());
